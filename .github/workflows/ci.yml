# CI for the infrastructure repo: static checks (fmt, validate, tflint, Trivy) plus a read-only terraform plan for
# envs/uat on pull requests. Never applies here.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  terraform:
    uses: viethung12062005/shp-platform-templates/.github/workflows/terraform-checks.yml@v0.1.8
    with:
      working-directory: .
  pr-checks:
    uses: viethung12062005/shp-platform-templates/.github/workflows/pr-checks.yml@v0.1.8
    permissions:
      contents: read
      pull-requests: read
  plan:
    # Read-only terraform plan for envs/uat with the ci-plan identity (Reader on the subscription + Storage Blob
    # Data Contributor on the state account). Fork PRs are skipped: GitHub withholds vars and refuses to issue an
    # OIDC token for pull_request events from forks, so azure/login cannot work there. The plan needs only repo-level
    # variables (AZURE_*, TFSTATE_STORAGE_ACCOUNT, ACR_NAME, ADMIN_IP_RANGES), all available on a same-repo PR.
    if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: azure/login@2035af27c2cea8ff426397d10e3edb28906b51df # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_CI_PLAN }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: init
        working-directory: envs/uat
        env:
          TFSTATE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
        run: |
          terraform init \
            -backend-config="resource_group_name=rg-shp-shared" \
            -backend-config="storage_account_name=$TFSTATE_ACCOUNT" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=uat.tfstate" \
            -backend-config="use_azuread_auth=true"
      - name: plan
        working-directory: envs/uat
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          ADMIN_IP_RANGES: ${{ vars.ADMIN_IP_RANGES }}
        run: |
          set -euo pipefail
          terraform plan -out=tfplan \
            -var "subscription_id=$ARM_SUBSCRIPTION_ID" \
            -var "acr_name=$ACR_NAME" \
            -var "created_at=$(date -u +%F)" \
            -var "authorized_ip_ranges=$ADMIN_IP_RANGES"
          { echo '### envs/uat plan (read-only, ci-plan identity)'; echo '```'; terraform show -no-color tfplan | head -300; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
