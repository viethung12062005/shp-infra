# CI for the infrastructure repo: static checks only (fmt, validate, tflint, Trivy config). Never applies here.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  terraform:
    uses: viethung12062005/shp-platform-templates/.github/workflows/terraform-checks.yml@v0.1.5
    with:
      working-directory: .
  pr-checks:
    uses: viethung12062005/shp-platform-templates/.github/workflows/pr-checks.yml@v0.1.5
    permissions:
      contents: read
      pull-requests: read
