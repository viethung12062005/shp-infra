# CI cho repo hạ tầng: chỉ kiểm tra tĩnh (fmt, validate, tflint, Trivy config). Không bao giờ apply ở đây.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  terraform:
    uses: viethung12062005/shp-platform-templates/.github/workflows/terraform-checks.yml@v0.1.1
    with:
      working-directory: .
  pr-checks:
    uses: viethung12062005/shp-platform-templates/.github/workflows/pr-checks.yml@v0.1.1
    permissions:
      contents: read
      pull-requests: read
