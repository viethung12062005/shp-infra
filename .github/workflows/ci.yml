# CI cho repo hạ tầng: chỉ kiểm tra tĩnh (fmt, validate, tflint, Trivy config). Không bao giờ apply ở đây.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  terraform:
    # Thay OWNER và phiên bản bằng giá trị thật của repo templates.
    uses: OWNER/shp-platform-templates/.github/workflows/terraform-checks.yml@v0.1.0
    with:
      working-directory: .
  pr-checks:
    uses: OWNER/shp-platform-templates/.github/workflows/pr-checks.yml@v0.1.0
    permissions:
      contents: read
      pull-requests: read
