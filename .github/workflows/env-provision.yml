# Dựng một môi trường (uat hoặc prod): plan → PHÊ DUYỆT (GitHub Environment infra-<env>) → apply.
# Môi trường là ephemeral: dựng khi cần thử/demo, hủy bằng env-destroy khi xong.
name: env-provision
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Môi trường cần dựng"
        type: choice
        options: [uat, prod]
        required: true
      sizing:
        description: "Kích cỡ (default: uat=small, prod=prod). Chọn prod khi UAT dùng để đo hiệu năng"
        type: choice
        options: [default, small, prod]
        default: default
permissions:
  contents: read
concurrency:
  group: env-${{ inputs.environment }}
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: azure/login@2035af27c2cea8ff426397d10e3edb28906b51df # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_CI_PLAN }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: init
        working-directory: envs/${{ inputs.environment }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TFSTATE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
        run: |
          terraform init \
            -backend-config="resource_group_name=rg-shp-shared" \
            -backend-config="storage_account_name=$TFSTATE_ACCOUNT" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${ENVIRONMENT}.tfstate" \
            -backend-config="use_azuread_auth=true"
      - name: plan
        working-directory: envs/${{ inputs.environment }}
        env:
          SIZING: ${{ inputs.sizing }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          ADMIN_IP_RANGES: ${{ vars.ADMIN_IP_RANGES }}
        run: |
          set -euo pipefail
          args=(-var "subscription_id=$ARM_SUBSCRIPTION_ID" -var "acr_name=$ACR_NAME" -var "created_at=$(date -u +%F)" -var "authorized_ip_ranges=$ADMIN_IP_RANGES")
          if [ "$SIZING" != default ]; then args+=(-var "sizing=$SIZING"); fi
          terraform plan -out=tfplan "${args[@]}"
          { echo '### Kế hoạch thay đổi'; echo '```'; terraform show -no-color tfplan | head -300; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfplan-${{ inputs.environment }}
          path: envs/${{ inputs.environment }}/tfplan
          retention-days: 1
  apply:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: infra-${{ inputs.environment }}   # dừng chờ người duyệt
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: azure/login@2035af27c2cea8ff426397d10e3edb28906b51df # v2.3.1
        with:
          client-id: ${{ inputs.environment == 'prod' && vars.AZURE_CLIENT_ID_INFRA_PROD || vars.AZURE_CLIENT_ID_INFRA_UAT }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tfplan-${{ inputs.environment }}
          path: envs/${{ inputs.environment }}
      - name: init
        working-directory: envs/${{ inputs.environment }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TFSTATE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
        run: |
          terraform init \
            -backend-config="resource_group_name=rg-shp-shared" \
            -backend-config="storage_account_name=$TFSTATE_ACCOUNT" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${ENVIRONMENT}.tfstate" \
            -backend-config="use_azuread_auth=true"
      - name: apply (đúng kế hoạch đã duyệt)
        working-directory: envs/${{ inputs.environment }}
        run: terraform apply tfplan
      - name: Kết quả
        working-directory: envs/${{ inputs.environment }}
        run: |
          { echo '### Môi trường đã dựng'; echo '```'; terraform output; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # TODO (ENV-01): cài Argo CD + áp dụng root Application trỏ tới repo GitOps (dùng `az aks command invoke`
      # để không phải mở API server cho runner), chờ healthy, seed dữ liệu giả, smoke test.
