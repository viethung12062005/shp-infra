# Daily: list environments that outlived their TTL and open/update a warning issue. Never destroys anything (destroying requires approval).
name: cost-guard
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: azure/login@2035af27c2cea8ff426397d10e3edb28906b51df # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_CI_PLAN }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Find overdue environments
        id: scan
        run: |
          az group list --query "[?tags.\"shp-env\"].{name:name, env:tags.\"shp-env\", created:tags.\"created-at\", ttl:tags.\"ttl-hours\"}" -o json > rgs.json
          python3 - <<'PY'
          import json, os, datetime
          today = datetime.date.today()
          overdue = []
          for rg in json.load(open("rgs.json")):
              try:
                  created = datetime.date.fromisoformat(rg["created"])
                  ttl_h = float(rg["ttl"])
              except (TypeError, ValueError):
                  overdue.append(f"- `{rg['name']}`: missing or invalid created-at/ttl-hours tag")
                  continue
              age_h = (today - created).days * 24
              if age_h > ttl_h:
                  overdue.append(f"- `{rg['name']}` ({rg['env']}): created {rg['created']}, TTL {ttl_h:g} h, overdue")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"count={len(overdue)}\n")
          open("overdue.md", "w").write("\n".join(overdue))
          PY
      - name: Open or update the warning issue
        if: steps.scan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          body="The environments below have outlived their TTL. If they are no longer needed, run the **env-destroy** workflow.\n\n$(cat overdue.md)"
          number=$(gh issue list --repo "$REPO" --label cost-guard --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$(printf '%b' "$body")"
          else
            gh issue create --repo "$REPO" --title "Cloud environments past TTL" --label cost-guard --body "$(printf '%b' "$body")"
          fi
